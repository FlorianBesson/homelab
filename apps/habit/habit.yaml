apiVersion: apps/v1
kind: Deployment
metadata:
  name: habit-deployment
  namespace: habit
  labels:
    app: habit
spec:
  replicas: 1
  selector:
    matchLabels:
      app: habit
  template:
    metadata:
      labels:
        app: habit
    spec:
      imagePullSecrets:
      - name: ghcr-secret

      containers:
      - name: habit
        image: ghcr.io/florianbesson/habit-tracker-app:latest
        imagePullPolicy: Always
        ports:
          - containerPort: 3000
        env:
          - name: DATABASE_URL
            value: file:/data/habits.db
        volumeMounts:
          - name: habit-data
            mountPath: /data
      volumes:
        - name: habit-data
          persistentVolumeClaim:
            claimName: habit-data
          # hostPath: 
          #   path: /data 
          #   type: Directory

