apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-deployment
  namespace: postgres
spec:
  replicas: 1
  selector: 
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres
        image: postgres:18.6-bookworm
        imagePullPolicy: IfNotPresent
        env:
        - name: POSTGRES_PASSWORD
          value: ${POSTGRES_PASSWORD}
        ports:
        - containerPort: 5432
        volumeMounts:
        - name: postgres-data
          mountPath: /data
      volumes:
      - persistentVolumeClaim: 
          claimName: postgres-data
        name: postgres-data
        
