apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-deployment
  namespace: postgres
spec:
  replicas: 1
  selector: 
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres
        image: postgres:18.6-bookworm
        imagePullPolicy: IfNotPresent
        envFrom:
          - configMapRef:
              name: paperless-config
          - secretRef:
              name: postgres-secret
        ports:
        - containerPort: 5432
        volumeMounts:
        - name: postgres-data
          mountPath: /var/lib/postgresql
      volumes:
      - persistentVolumeClaim: 
          claimName: postgres-data
        name: postgres-data
        
